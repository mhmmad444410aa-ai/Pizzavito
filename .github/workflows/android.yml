name: Pizzavito Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GODOT_VERSION: 4.5.1
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          tag="$GODOT_VERSION-stable"
          base="https://github.com/godotengine/godot-builds/releases/download/$tag"
          curl -fsSL --retry 3 "$base/Godot_v${tag}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install "/tmp/godot/Godot_v${tag}_linux.x86_64" /usr/local/bin/godot
          curl -fsSL --retry 3 "$base/Godot_v${tag}_export_templates.tpz" -o /tmp/templates.zip
          unzip -q /tmp/templates.zip -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mv /tmp/godot-templates/templates "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable"
          godot --version
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$RUNNER_TEMP/android-sdk}}"
          mkdir -p "$sdk"
          manager="$(find "$sdk/cmdline-tools" -path '*/bin/sdkmanager' -type f 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$manager" ] || [ ! -x "$manager" ]; then
            curl -fsSL --retry 3 "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "$RUNNER_TEMP/android-commandline.zip"
            mkdir -p "$RUNNER_TEMP/android-commandline" "$sdk/cmdline-tools"
            unzip -q "$RUNNER_TEMP/android-commandline.zip" -d "$RUNNER_TEMP/android-commandline"
            mv "$RUNNER_TEMP/android-commandline/cmdline-tools" "$sdk/cmdline-tools/ci"
            manager="$sdk/cmdline-tools/ci/bin/sdkmanager"
          fi
          test -x "$manager"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$(dirname "$manager")" >> "$GITHUB_PATH"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
          "$manager" --sdk_root="$sdk" --version
          set +o pipefail
          yes | "$manager" --sdk_root="$sdk" --licenses >/dev/null
          set -o pipefail
          "$manager" --sdk_root="$sdk" "platform-tools" "build-tools;35.0.0" "platforms;android-35" "ndk;28.1.13356709"
          test -x "$sdk/build-tools/35.0.0/apksigner"
          test -x "$sdk/build-tools/35.0.0/zipalign"
          mkdir -p "$HOME/.config/godot" build
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$sdk" "$JAVA_HOME" > "$HOME/.config/godot/editor_settings-4.5.tres"
      - name: Download and select CC0 source models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          python3 -m py_compile tools/fetch_assets.py
          python3 -u tools/fetch_assets.py 2>&1 | tee build/assets.log
          python3 -m py_compile tools/fetch_visuals.py
          python3 -u tools/fetch_visuals.py 2>&1 | tee build/visuals.log
          python3 tools/generate_art.py
          godot --headless --path . --script tools/export_icon.gd
      - name: Prepare native Godot Android template and Petal Ads
        run: python3 tools/prepare_ads_android.py
      - name: Import project and run smoke test
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path . --import 2>&1 | tee build/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|couldn.t be loaded as a buffer' build/import.log; then exit 1; fi
          timeout 90 godot --headless --path . -- --smoke-test 2>&1 | tee build/smoke.log
          grep -q PIZZAVITO_SMOKE_OK build/smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' build/smoke.log; then exit 1; fi
      - name: Export and sign test APK
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          tools="$sdk/build-tools/35.0.0"
          test -f "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable/android_debug.apk"
          grep -q "^textures/vram_compression/import_etc2_astc=true$" project.godot
          godot --headless --verbose --path . --export-debug Android "$PWD/build/test-unsigned.apk" 2>&1 | tee build/export.log
          keytool -genkeypair -keystore "$RUNNER_TEMP/test.jks" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Pizzavito Test"
          "$tools/zipalign" -P 16 -f 4 build/test-unsigned.apk build/test-aligned.apk
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/test.jks" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out build/Pizzavito-TEST.apk build/test-aligned.apk
          "$tools/apksigner" verify --verbose --print-certs build/Pizzavito-TEST.apk > build/test-certificate.txt
          "$tools/zipalign" -c -P 16 4 build/Pizzavito-TEST.apk
          python3 tools/verify_apk.py build/Pizzavito-TEST.apk
          rm build/test-unsigned.apk build/test-aligned.apk
      - name: Optional production Release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          tools="$sdk/build-tools/35.0.0"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          trap 'rm -f "$RUNNER_TEMP/release.jks"' EXIT
          godot --headless --path . --export-release Android "$PWD/build/release-unsigned.apk"
          "$tools/zipalign" -P 16 -f 4 build/release-unsigned.apk build/release-aligned.apk
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out build/Pizzavito-RELEASE.apk build/release-aligned.apk
          "$tools/apksigner" verify --verbose --print-certs build/Pizzavito-RELEASE.apk > build/release-certificate.txt
          "$tools/zipalign" -c -P 16 4 build/Pizzavito-RELEASE.apk
          python3 tools/verify_apk.py build/Pizzavito-RELEASE.apk
          "$sdk/build-tools/35.0.0/aapt" dump badging build/Pizzavito-RELEASE.apk > build/release-badging.txt
          "$sdk/build-tools/35.0.0/aapt" dump xmltree build/Pizzavito-RELEASE.apk AndroidManifest.xml > build/release-manifest.txt
          grep -q PizzavitoAds build/release-manifest.txt
          grep -q android.permission.INTERNET build/release-manifest.txt
          sha256sum build/Pizzavito-RELEASE.apk > build/release-sha256.txt
          rm build/release-unsigned.apk build/release-aligned.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pizzavito-build
          path: |
            build/Pizzavito-*.apk
            build/*.log
            build/*-certificate.txt
            build/release-*.txt
            assets/imported/manifest.json
            assets/imported/visuals-report.json
          if-no-files-found: warn
